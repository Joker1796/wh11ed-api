# The local stand: the whole backend on one machine — PostgreSQL, this API, a stand-in for
# Yandex sign-in and a mail catcher — with no cloud account, no secrets and no production data.
# DEVELOPMENT.md is the walkthrough; the short version:
#
#   npm run stand          # build/start everything, wait until healthy (first run pulls images)
#   npm run stand:seed     # test players Алиса/Боб/Вера with lists, games, reports
#   cd ../wh11ed && npm run dev           # the site on http://localhost:5173, already pointed here
#
#   http://localhost:8787/health   the API          http://localhost:8025   Mailpit (bug-report mail)
#   http://localhost:8790/authorize  the sign-in page the "Войти" button lands on
#
# Every port is a host-side default that a variable moves (STAND_*_PORT), for a machine where one
# is taken. The API's own port is the exception: the frontend's default API address is :8787.
name: wh11ed-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wh
      POSTGRES_PASSWORD: wh
      POSTGRES_DB: wh
    ports:
      # 5433, not 5432: a developer's own Postgres usually sits on 5432.
      - "${STAND_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wh -d wh"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${STAND_MAIL_PORT:-8025}:8025"   # the inbox, in a browser
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  fake-oauth:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./stand:/app:ro
    command: ["node", "fake-oauth.mjs"]
    ports:
      - "${STAND_OAUTH_PORT:-8790}:8790"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8790/x').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: node:22-slim
    working_dir: /app
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      fake-oauth: { condition: service_healthy }
    volumes:
      - .:/app
      # A NAMED volume for node_modules: the container's Linux install must not mix with the host
      # tree's macOS one, and `docker compose exec` (seed, tests) must find it there.
      - api-node-modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://wh:wh@postgres:5432/wh
      # Every origin a "phone" can sit on: one browser, one localStorage per port. A port missing
      # here is a CORS refusal, not a bug.
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
      API_BASE_URL: http://localhost:8787
      APP_AFTER_LOGIN_URL: http://localhost:5173/tracker/auth-callback
      JWT_SIGNING_KEY: stand-only-insecure-key-0000000000000000
      # Sign-in goes through stand/fake-oauth.mjs. The browser opens the authorize page on the
      # host's port; the API reaches the other two inside the compose network.
      YANDEX_CLIENT_ID: stand
      YANDEX_CLIENT_SECRET: stand
      OAUTH_YANDEX_AUTHORIZE_URL: http://localhost:${STAND_OAUTH_PORT:-8790}/authorize
      OAUTH_YANDEX_SERVER_URL: http://fake-oauth:8790
      OAUTH_YANDEX_INFO_URL: http://fake-oauth:8790/info
      # Bug-report mail lands in Mailpit.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FEEDBACK_MAIL_FROM: stand@wh-rules.local
      FEEDBACK_MAIL_TO: owner@wh-rules.local
      # The frontend's dev mock fetches a token here for /party (useAuth.js); harmless on the stand.
      DEV_JWT: "1"
      # The API description: http://localhost:8787/swagger (and /openapi.json). Stand only.
      SWAGGER: "1"
      PORT: "8787"
    ports:
      - "8787:8787"
    # Install into the named volume whenever the lock file's CONTENT moved (a stamp of its hash —
    # not its date: a branch switch gives it any mtime, and 2026-10-23 a stand ran zod 3 against
    # zod 4 code that way), apply new migrations, then the watching dev server.
    # NOT `npm run dev`: that reads a developer's own .env (`--env-file-if-exists`), which the
    # stand must not see, and under --watch Node crashes when that file is absent.
    entrypoint: ["sh", "-c", "[ \"$(sha1sum < package-lock.json)\" = \"$(cat node_modules/.lock-sha1 2>/dev/null)\" ] || { npm ci --no-audit --no-fund && sha1sum < package-lock.json > node_modules/.lock-sha1; }; node --import tsx scripts/migrate.ts && exec \"$0\" \"$@\""]
    command: ["node", "--import", "tsx", "--watch", "src/server.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
  api-node-modules:
