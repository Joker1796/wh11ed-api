openapi: 3.0.0
info:
  title: wh11ed-api
  version: 0.1.0

# Single greedy route: the gateway forwards every method/path to the function, which does its
# own routing (Hono) and CORS. ${function_id} / ${gateway_sa_id} are filled by Terraform
# templatefile(). A rate limit caps abuse/cost — and it is the cost ceiling: at 142 ₽ per
# million requests this number bounds the monthly bill. A shared live game (/party) is four
# phones at a three-second tick ≈ 80 rpm per game, so this budget holds ~7 games together with
# logins and backups; raise it before that feature reaches players. Terraform cannot apply this
# file (README) — edit the live spec with `yc serverless api-gateway update` or the console.
x-yc-apigateway:
  rateLimit:
    allRequests:
      rpm: 600

paths:
  /:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${function_id}
        tag: $latest
        service_account_id: ${gateway_sa_id}
  /{proxy+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: proxy
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${function_id}
        tag: $latest
        service_account_id: ${gateway_sa_id}
