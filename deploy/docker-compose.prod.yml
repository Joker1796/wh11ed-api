# Production on one server: Caddy (TLS, the only thing listening outside) → the API → PostgreSQL.
# Lives on the server as /opt/wh-rules/ next to its .env (deploy/.env.prod.example). Runbook: README
# "Deploy".
#
# Only Caddy publishes ports. Docker writes its own iptables rules and walks past ufw, so a
# published database port would be open to the internet whatever ufw says — Postgres has none.
name: wh-rules

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: wh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wh -d wh"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://wh:${POSTGRES_PASSWORD}@postgres:5432/wh
      PORT: "8787"
    # The site's hidden source maps, one folder per version (wh11ed deploy.sh copies them): the error
    # commands read a stack back to the source here. Read-only; created on first use if absent.
    volumes:
      - /opt/wh-rules/sourcemaps:/app/sourcemaps:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
